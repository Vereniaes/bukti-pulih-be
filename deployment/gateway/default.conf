# Only the browser API and health check can cross the public gateway.
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 5m;

    location = /api/v1/internal { return 404; }
    location ^~ /api/v1/internal/ { return 404; }
    location = /health { include /etc/nginx/conf.d/backend.inc; }
    location /api/v1/ { include /etc/nginx/conf.d/backend.inc; }
    location / { return 404; }
}
